<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bağış Listesi</title>
<style>
:root{--bg:#f2f5f4;--surface:#fff;--ink:#14201c;--muted:#5d6b66;--line:#d9e1de;--accent:#0f6b5c;--accent-ink:#fff;--danger:#b3261e;--total-bg:#14201c;--total-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--surface:#18211e;--ink:#e8efec;--muted:#93a39d;--line:#2a3733;--accent:#3fb59f;--accent-ink:#06130f;--danger:#f2877f;--total-bg:#e8efec;--total-ink:#0f1513}}
:root[data-theme="dark"]{--bg:#0f1513;--surface:#18211e;--ink:#e8efec;--muted:#93a39d;--line:#2a3733;--accent:#3fb59f;--accent-ink:#06130f;--danger:#f2877f;--total-bg:#e8efec;--total-ink:#0f1513}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 12px 10px;display:flex;gap:8px}
select{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:46px}
.new{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;font:inherit;font-weight:600;padding:0 14px;height:46px;cursor:pointer;white-space:nowrap}
.bar{display:flex;gap:8px;padding:0 12px 10px}
.bar input{flex:1;min-width:0;height:42px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.bar select{flex:0 0 auto;width:auto;height:42px;font-size:14px;font-weight:600;padding:0 8px}
main{flex:1;overflow-y:auto;padding:0 12px 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:34px 1fr auto 44px;align-items:center;min-height:48px;border-top:1px solid var(--line);padding-left:10px}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row.tap:hover{background:rgba(127,127,127,.07)}
.row.hit{box-shadow:inset 3px 0 0 var(--accent)}
.no{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.nm{overflow-wrap:anywhere;padding:8px 8px 8px 0}
.nm small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.am{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;padding:8px 6px}
.del{background:none;border:0;color:var(--muted);font-size:20px;height:48px;cursor:pointer}
.del:hover,.del:focus-visible{color:var(--danger)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.dock{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px 0}
.entry{display:grid;grid-template-columns:1fr 112px 52px;gap:8px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
input{height:48px}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input#amount{text-align:right}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;font-size:26px;font-weight:600;cursor:pointer;height:48px}
.total{margin:10px -12px 0;background:var(--total-bg);color:var(--total-ink);display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.total .lbl{font-size:14px;opacity:.8}
.total .sum{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.total.all{background:transparent;color:var(--muted);border-top:1px solid var(--line);padding:8px 16px;margin-top:0}
.total.all .sum{font-size:17px;font-weight:600;color:var(--ink)}
.total.all .lbl{font-size:13px}
.total.all.tap{cursor:pointer}
.total.all.tap:hover{background:rgba(127,127,127,.08)}
.total.all .chev{font-size:18px;font-weight:700;margin-left:8px;opacity:.6}
.total.all .lbl{flex:1;text-align:left}
.plist{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 6px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pn{font-weight:600;overflow-wrap:anywhere}
.prow .pk{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.prow .pd{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.45}
.plist .empty2{padding:14px;text-align:center;color:var(--muted);font-size:14px}
.msg{font-size:13px;min-height:18px;padding:4px 2px 0;color:var(--muted)}
.msg.bad{color:var(--danger)}
.tools{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 12px 6px;justify-content:flex-end}
.tools button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;z-index:20}
#modal[hidden]{display:none}
.box{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.box p{margin:0}
.box textarea{height:150px;resize:none;font-size:13px}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btns button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px;cursor:pointer}
.btns .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><select id="sel" aria-label="Liste seç"></select><button class="new" id="newl" type="button">Yeni liste</button></header>
<div class="bar">
  <input id="q" type="search" placeholder="İsimde ara…" autocomplete="off" aria-label="Ara">
  <select id="sort" aria-label="Sırala">
    <option value="none">Eklenme sırası</option>
    <option value="name">İsim A→Z</option>
    <option value="nameD">İsim Z→A</option>
    <option value="amtD">Tutar ↓ (büyük önce)</option>
    <option value="amt">Tutar ↑ (küçük önce)</option>
  </select>
</div>
<main id="main"><div class="list" id="list"></div></main>
<div class="tools"><button id="copy" type="button">Listeyi kopyala</button><button id="ren" type="button">Adını değiştir</button><button id="dell" type="button">Listeyi sil</button><button id="bak" type="button">Yedek</button></div>
<div class="dock">
  <div class="entry">
    <input id="name" type="text" placeholder="İsim" autocomplete="off" enterkeyhint="next">
    <input id="amount" type="text" inputmode="decimal" placeholder="Tutar" autocomplete="off" enterkeyhint="done">
    <button class="add" id="add" type="button" aria-label="Satır ekle">+</button>
  </div>
  <div class="msg" id="err" role="status"></div>
  <div class="total"><span class="lbl" id="lbl">Toplam</span><span class="sum" id="sum">0,00 ₺</span></div>
  <div class="total all tap" id="allbox" role="button" tabindex="0" aria-label="Genel toplam listesini aç"><span class="lbl" id="albl">Genel toplam</span><span class="sum" id="asum">0,00 ₺</span><span class="chev" aria-hidden="true">›</span></div>
</div>
<div id="modal" hidden><div class="box" role="dialog" aria-modal="true">
  <p id="mmsg"></p><input id="min" type="text" autocomplete="off"><textarea id="mta"></textarea>
  <div class="btns" id="mbtns"></div>
</div></div>
<input type="file" id="file" accept=".json,.txt,application/json,text/plain" hidden>
<script>
var KEY="bagis-listesi-v3",OLD="bagis-listesi-v2",OLD1="bagis-listesi-v1",MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var $=function(i){return document.getElementById(i)};
var fmt=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
function money(k){return fmt.format(k/100)+" ₺"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defName(){var d=new Date();return MONTHS[d.getMonth()]+" "+d.getFullYear()}
function norm(s){return String(s).trim().replace(/\s+/g," ").toLocaleLowerCase("tr")}
var data=null;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data||!data.lists||!data.lists.length){
  var prev=null;
  try{prev=JSON.parse(localStorage.getItem(OLD)||"null")}catch(e){}
  if(prev&&prev.lists&&prev.lists.length){
    data=prev; /* v2 verisi olduğu gibi devralınır */
  }else{
    var old=[];try{old=JSON.parse(localStorage.getItem(OLD1)||"[]")}catch(e){}
    var id=uid();data={cur:id,lists:[{id:id,name:defName(),items:old}]};
  }
}
function cur(){for(var i=0;i<data.lists.length;i++)if(data.lists[i].id===data.cur)return data.lists[i];data.cur=data.lists[0].id;return data.lists[0]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function note(t,bad){var e=$("err");if(!e)return;e.textContent=t;e.className="msg"+(bad?" bad":"");if(!bad)setTimeout(function(){if(e.textContent===t)e.textContent=""},2000)}
var dlgButtons=null,dlgBusy=false;
/* Modalı her açılışta sıfırdan kurar; hiçbir butona sabit id vermez,
   böylece id çakışması yüzünden butonların ölmesi imkânsız olur. */
function openModal(o){
  var m=$("modal"),inp=$("min"),ta=$("mta"),btns=$("mbtns");
  dlgButtons=o.buttons||null;
  $("mmsg").textContent=o.msg||"";
  inp.hidden=!o.input;ta.hidden=!o.area;
  inp.value=o.input?(o.def||""):"";ta.value=o.area?(o.def||""):"";
  btns.innerHTML="";
  return new Promise(function(res){
    var done=false;
    function close(v){if(done)return;done=true;m.hidden=true;btns.innerHTML="";res(v)}
    function addBtn(label,cls,value){
      var b=document.createElement("button");b.type="button";b.textContent=label;
      if(cls)b.className=cls;
      b.onclick=function(){close(value)};
      btns.appendChild(b);return b;
    }
    if(o.buttons&&o.buttons.length){
      o.buttons.forEach(function(x){addBtn(x.label,x.primary?"primary":"",x.value)});
    }else{
      addBtn(o.cancel||"Vazgeç","",null);
      if(o.extra)addBtn(o.extra,"",{extra:true});
      addBtn(o.ok||"Tamam","primary","ok");
    }
    inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();close(o.input?inp.value:"ok")}};
    m.hidden=false;
    try{(o.input?inp:o.area?ta:btns.firstChild).focus()}catch(e){}
    if(o.input)try{inp.select()}catch(e){}
  });
}
function dlg(o){return openModal(o).then(function(v){return v})}
function parse(s){
  s=String(s).replace(/[\s\u00a0\u20ba]/g,"");if(!s)return null;
  s=s.replace(/[Tt][Ll]$/,"");if(!s)return null;
  if(s.indexOf(",")>-1)s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  if(!/^\d+(\.\d{1,2})?$/.test(s))return null;
  var k=Math.round(parseFloat(s)*100);return k>0?k:null;
}
/* --- görünen sıra: arama + sıralama --- */
function view(){
  var L=cur(),items=L.items.slice(),i;
  var q=norm($("q").value||"");
  if(q){var out=[];for(i=0;i<items.length;i++){var it=items[i];it.__i=i;if(norm(it.n).indexOf(q)>-1)out.push(it)}items=out}
  else{for(i=0;i<items.length;i++)items[i].__i=i}
  var s=$("sort").value;if(!s){s="none";$("sort").value="none"}
  if(s==="name")items.sort(function(a,b){return a.n.localeCompare(b.n,"tr")});
  else if(s==="nameD")items.sort(function(a,b){return b.n.localeCompare(a.n,"tr")});
  else if(s==="amtD")items.sort(function(a,b){return b.k-a.k||a.n.localeCompare(b.n,"tr")});
  else if(s==="amt")items.sort(function(a,b){return a.k-b.k||a.n.localeCompare(b.n,"tr")});
  return items;
}
var keepScroll=0;
function render(scroll){
  var L=cur(),items=L.items,l=$("list"),t=0,s=$("sel"),i;
  var qt=norm($("q").value||"");
  s.innerHTML="";data.lists.forEach(function(x){var o=document.createElement("option");o.value=x.id;o.textContent=x.name;if(x.id===L.id)o.selected=true;s.appendChild(o)});
  for(i=0;i<items.length;i++)t+=items[i].k;
  var shown=view(),q=qt;
  l.innerHTML="";
  if(!items.length)l.innerHTML='<div class="empty">Bu listede henüz satır yok. İsim ve tutarı yazıp + tuşuna basın.</div>';
  else if(!shown.length)l.innerHTML='<div class="empty">“'+$("q").value+'” ile eşleşen satır yok.</div>';
  shown.forEach(function(it,idx){
    var r=document.createElement("div");r.className="row tap";
    if(q&&norm(it.n)===q)r.className+=" hit";
    var a=document.createElement("span");a.className="no";a.textContent=(it.__i+1);
    var b=document.createElement("span");b.className="nm";b.textContent=it.n;
    if(q){var hi=norm(it.n).indexOf(q);if(hi>-1){b.textContent="";b.append(document.createTextNode(it.n.slice(0,hi)));var m=document.createElement("b");m.textContent=it.n.slice(hi,hi+q.length);b.append(m);b.append(document.createTextNode(it.n.slice(hi+q.length)))}}
    var c=document.createElement("span");c.className="am";c.textContent=money(it.k);
    var d=document.createElement("button");d.className="del";d.type="button";d.textContent="×";d.setAttribute("aria-label",it.n+" satırını sil");
    d.onclick=function(ev){ev.stopPropagation();delRow(it)};
    r.onclick=function(){editRow(it)};
    r.append(a,b,c,d);l.appendChild(r);
  });
  $("sum").textContent=money(t);
  /* genel toplam: tüm listeler */
  var gt=0,gi=0;
  data.lists.forEach(function(x){
    for(var z=0;z<x.items.length;z++){gt+=x.items[z].k;gi++}
  });
  $("asum").textContent=money(gt);
  $("albl").textContent="Genel toplam ("+data.lists.length+" liste, "+gi+" kişi)";
  if(q&&shown.length!==items.length){
    var st=0;for(i=0;i<shown.length;i++)st+=shown[i].k;
    $("lbl").textContent="Arama: "+shown.length+"/"+items.length+" kişi ("+money(st)+")";
  }else{
    $("lbl").textContent=items.length?"Toplam ("+items.length+" kişi)":"Toplam";
  }
  var m=$("main");
  if(scroll)m.scrollTop=m.scrollHeight;else m.scrollTop=keepScroll;
  keepScroll=0;
}
/* --- satır düzenleme --- */
function editRow(it){
  dlg({msg:"Satırı düzenle (boş bırakırsan isim değişmez):",input:true,def:it.n,ok:"Devam"}).then(function(v){
    if(v===null)return;
    var n=String(v).trim()||it.n;
    dlg({msg:n+" — yeni tutar:",input:true,def:fmt.format(it.k/100).replace(/\./g,""),ok:"Kaydet"}).then(function(w){
      if(w===null)return;
      var k=parse(w);
      if(k===null){note("Geçerli bir tutar yazın.",1);return}
      var dup=findByName(cur(),n,it);
      if(dup){
        dlg({msg:"“"+n+"” listede zaten var ("+money(dup.k)+"). İki satır birleştirilsin mi? Birleşirse tutarlar toplanır.",ok:"Birleştir",cancel:"Vazgeç"}).then(function(c){
          if(c===null)return;
          it.n=n;it.k=k;dup.k+=k;
          cur().items=cur().items.filter(function(x){return x!==it});
          save();render(false);note("Satırlar birleştirildi");
        });return;
      }
      it.n=n;it.k=k;save();render(false);note("Güncellendi");
    });
  });
}
function delRow(it){
  dlg({msg:it.n+" ("+money(it.k)+") silinsin mi?",ok:"Sil"}).then(function(v){
    if(v===null)return;
    cur().items=cur().items.filter(function(x){return x!==it});
    save();render(false)
  })
}
function findByName(L,n,skip){
  var key=norm(n);
  for(var i=0;i<L.items.length;i++){var x=L.items[i];if(x!==skip&&norm(x.n)===key)return x}
  return null;
}
/* --- ekleme (aynı isim uyarısı ile) --- */
function add(){
  var n=$("name").value.trim(),k=parse($("amount").value);
  if(!n){note("İsim yazın.",1);$("name").focus();return}
  if(k===null){note("Geçerli bir tutar yazın (örnek: 1500 veya 1.500,50).",1);$("amount").focus();return}
  note("");
  var dup=findByName(cur(),n,null);
  if(dup){
    openModal({msg:"“"+n+"” bu listede zaten var — kayıtlı tutar: "+money(dup.k)+". Ne yapmak istersiniz?",buttons:[
      {label:"Vazgeç",value:null},
      {label:"Yeni satır ekle",value:"new"},
      {label:"Güncelle",value:"ok",primary:true}
    ]}).then(function(c){
      if(c===null||c===undefined)return;
      if(c!=="ok"){ /* "Yeni satır ekle" */
        cur().items.push({n:n,k:k});save();clearEntry();render(true);note("Ayrı satır olarak eklendi");
        return;
      }
      dup.k=k;save();clearEntry();render(false);note("“"+n+"” güncellendi: "+money(k));
    });
    return;
  }
  cur().items.push({n:n,k:k});save();clearEntry();render(true);$("name").focus();
}
function clearEntry(){$("name").value="";$("amount").value=""}
$("add").onclick=add;
$("name").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("amount").focus()}});
$("amount").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();add()}});
$("q").addEventListener("input",function(){render(false)});
$("sort").onchange=function(){render(false)};
$("sel").onchange=function(){data.cur=this.value;$("q").value="";save();render(false)};
$("newl").onclick=function(){dlg({msg:"Yeni listenin adı:",input:true,def:defName(),ok:"Oluştur"}).then(function(v){
  if(v===null||!v.trim())return;var id=uid();data.lists.push({id:id,name:v.trim(),items:[]});data.cur=id;save();$("q").value="";render(false);$("name").focus()})};
$("ren").onclick=function(){var L=cur();dlg({msg:"Listenin yeni adı:",input:true,def:L.name,ok:"Kaydet"}).then(function(v){
  if(v===null||!v.trim())return;L.name=v.trim();save();render(false)})};
$("dell").onclick=function(){var L=cur();dlg({msg:"“"+L.name+"” listesi ve içindeki "+L.items.length+" satır silinsin mi? Bu işlem geri alınamaz.",ok:"Listeyi sil"}).then(function(v){
  if(v===null)return;data.lists=data.lists.filter(function(x){return x.id!==L.id});
  if(!data.lists.length)data.lists.push({id:uid(),name:defName(),items:[]});
  data.cur=data.lists[data.lists.length-1].id;save();render(false)})};
$("copy").onclick=function(){
  var it=cur().items;
  var tx=it.map(function(x){return x.n+": "+fmt.format(x.k/100)}).join("\n")+"\nToplam= "+fmt.format(it.reduce(function(s,x){return s+x.k},0)/100);
  try{navigator.clipboard.writeText(tx).then(function(){note("Kopyalandı")},function(){note("Kopyalanamadı",1)})}catch(e){note("Kopyalanamadı",1)}
};
/* --- yedek / geri yükleme ---
   Tek format: JSON (format="bagis-listesi-backup-v2"), tüm listeler.
   Eski .txt yedekleri geri yüklerken hâlâ okunur. */
var BACKUP_FORMAT="bagis-listesi-backup-v2";
function stamp(){var d=new Date();function p(x){return (x<10?"0":"")+x}
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())}
function safeName(s){return String(s).replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g," ").trim()||"liste"}
/* Tüm listeleri tek JSON yedeğine yazar; hiçbir liste dışarıda kalmaz. */
function backupPayload(){
  return {
    format: BACKUP_FORMAT,
    app: "BagisListesi",
    version: 1,
    savedAt: new Date().toISOString(),
    current: (function(){var L=cur();return L?L.name:""})(),
    lists: data.lists.map(function(L){
      return {
        name: L.name,
        items: L.items.map(function(x){return {n:x.n,k:x.k}})
      };
    })
  };
}
function backupText(){
  var L=cur();
  var lines=[
    "# Bağış Listesi Yedeği",
    "# Liste: "+L.name,
    "# Tarih: "+new Date().toLocaleString("tr-TR"),
    "# Biçim: İsim | Tutar",
    "## Liste: "+L.name
  ];
  L.items.forEach(function(x){lines.push(x.n+" | "+fmt.format(x.k/100))});
  lines.push("# Toplam ("+L.items.length+" kişi): "+fmt.format(L.items.reduce(function(s,x){return s+x.k},0)/100));
  return lines.join("\r\n")+"\r\n";
}
function doBackup(){
  var name="bagis-yedek-"+stamp()+".json";
  var txt;
  try{txt=JSON.stringify(backupPayload(),null,2)}
  catch(e){note("Yedek oluşturulamadı: "+e.message,1);return}
  var L=data.lists.length, kisi=0;
  data.lists.forEach(function(x){kisi+=x.items.length});
  /* 1) Android köprüsü: doğrudan İndirilenler klasörüne yaz (sayfa yenilenmez) */
  var bridgeError="";
  try{
    var br=(window.BagisBackup&&typeof window.BagisBackup.saveToDownloads==="function")?window.BagisBackup:null;
    if(br){
      var ok=br.saveToDownloads(name,txt);
      if(ok===true||ok==="true"){
        note("Yedek kaydedildi: "+name+" ("+L+" liste, "+kisi+" kişi) → İndirilenler");
        return;
      }
      bridgeError="uygulama köprüsü yazamadı";
    }
  }catch(e){bridgeError=(e&&e.message)||"köprü hatası"}
  /* 2) tarayıcı / yedek: indirme bağlantısı */
  try{
    var blob=new Blob([txt],{type:"application/json;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download=name;a.rel="noopener";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){try{URL.revokeObjectURL(url)}catch(e){}},2000);
    note("Yedek indirildi: "+name+" ("+L+" liste, "+kisi+" kişi)");
  }catch(e){
    note("Yedek kaydedilemedi"+(bridgeError?" ("+bridgeError+")":"")+". Yedeği metin olarak kopyalayıp bir yere yapıştırabilirsiniz.",1);
  }
}
function doRestore(){
  keepScroll=$("main").scrollTop;
  /* 1) Android dosya seçici köprüsü */
  try{
    if(window.BagisFile&&typeof window.BagisFile.pick==="function"){
      note("Dosya seçici açılıyor…");
      window.BagisFile.pick();
      return;
    }
  }catch(e){}
  /* 2) tarayıcı: dosya girdisi */
  var inp=$("file");
  if(!inp){note("Bu sürümde dosya seçici yok.",1);return}
  inp.value="";
  inp.onchange=function(){
    var f=this.files&&this.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onerror=function(){note("Dosya okunamadı.",1)};
    fr.onload=function(){applyRestore(String(fr.result||""),f.name||"")};
    fr.readAsText(f,"UTF-8");
  };
  inp.click();
}
/* Dosya seçici iptal edilirse ya da okunamazsa Android tarafı bunu çağırır */
window.bagisPickerFailed=function(){note("Geri yükleme için dosya seçilmedi.",1)};
/* Android yedek dosyasını okuduğunda bunu çağırır */
window.bagisRestore=function(contents){
  try{return applyRestore(String(contents||""),"")}
  catch(e){note("Yedek geri yüklenemedi: "+e.message,1)}
};
/* Eski ad: geriye dönük uyumluluk */
window.restoreBagisBackup=window.bagisRestore;
/* MainActivity yedek dosyasını okuduğunda bunu çağırır */
window.restoreBagisBackup=function(contents){
  try{return applyRestore(String(contents||""),"")}
  catch(e){note("Yedek geri yüklenemedi: "+e.message,1)}
};
/* Eski sürümün JSON yedeği: {format, list:{name, items:[{name, amountKurus}]}} */
window.__bagisJsonBackup=function(obj){
  try{
    if(!obj||!obj.list||!Array.isArray(obj.list.items))throw new Error("Geçersiz yedek");
    var items=obj.list.items.map(function(x){return {n:String(x.name||"").trim(),k:x.amountKurus|0}})
      .filter(function(x){return x.n&&x.k>0});
    var nm=String(obj.list.name||"").trim()||defName();
    return applyRestore("## Liste: "+nm+"\n"+items.map(function(x){return x.n+" | "+fmt.format(x.k/100)}).join("\n"),nm);
  }catch(e){note("Yedek geri yüklenemedi: "+e.message,1)}
};
/* Yedek metnini uygular. Android köprüsü ve dosya seçici buradan geçer. */
function applyRestore(raw,fileName){
  var payload=parseFullBackup(raw);
  if(payload)return applyFullBackup(payload);
  var parsed=parseMultiBackup(raw);
  if(!parsed.length)parsed=parseBackup(raw).length?[{name:(fileName||"").replace(/\.[tj]xt$/i,"")||defName(),items:parseBackup(raw)}]:[];
  if(!parsed.length){note("Dosyada okunabilir satır bulunamadı.",1);return}
  /* Birden çok liste içeren metin yedeği: her liste kendi adıyla geri yüklenir */
  if(parsed.length>1){
    var ozetCok=parsed.map(function(x){return "• "+x.name+" ("+x.items.length+" kişi)"}).join("\n");
    return dlg({msg:parsed.length+" liste bulundu:\n"+ozetCok+"\n\nHer liste kendi adıyla geri yüklenecek. Aynı adlı liste varsa içeriği yedekle değiştirilir.",ok:"Geri yükle",cancel:"Vazgeç"}).then(function(c){
      if(c===null)return;
      var yeniC=0,guncC=0;
      parsed.forEach(function(bk){
        var ex=null;for(var i=0;i<data.lists.length;i++)if(norm(data.lists[i].name)===norm(bk.name))ex=data.lists[i];
        if(ex){ex.items=bk.items.slice();guncC++}
        else{data.lists.push({id:uid(),name:bk.name,items:bk.items.slice()});yeniC++}
      });
      save();$("q").value="";render(false);
      note(yeniC+" liste eklendi, "+guncC+" liste güncellendi");
    });
  }
  var nm=parsed[0].name||(fileName||"").replace(/\.[tj]xt$/i,"")||defName();
  var toplamSatir=parsed.reduce(function(a,x){return a+x.items.length},0);
  var ozet=parsed.map(function(x){return "• "+x.name+" ("+x.items.length+" kişi)"}).join("\n");
  return openModal({msg:toplamSatir+" satır bulundu:\n"+ozet+"\n\nNereye yüklensin?",buttons:[
    {label:"Vazgeç",value:null},
    {label:"Yeni liste aç",value:"new"},
    {label:"Bu listeye ekle",value:"ok",primary:true}
  ]}).then(function(c){
    if(c===null||c===undefined)return;
    if(c!=="ok"){
      var id=uid();
      data.lists.push({id:id,name:nm,items:parsed[0].items});
      data.cur=id;save();$("q").value="";render(false);
      note("Yeni liste oluşturuldu: "+parsed[0].items.length+" satır");
      return;
    }
    var L=cur(),eklendi=0,guncellendi=0;
    parsed.forEach(function(bk){
      bk.items.forEach(function(p){
        var d=findByName(L,p.n,null);
        if(d){d.k=p.k;guncellendi++}else{L.items.push(p);eklendi++}
      });
    });
    save();$("q").value="";render(false);
    note(eklendi+" eklendi, "+guncellendi+" güncellendi");
  });
}
/* --- tam yedek (tüm listeler, JSON) --- */
function parseFullBackup(text){
  var j=null;
  try{j=JSON.parse(String(text))}catch(e){return null}
  if(!j||!Array.isArray(j.lists)||!j.lists.length)return null;
  var ok=true,lists=[];
  j.lists.forEach(function(L){
    if(!L||typeof L.name!=="string"||!L.name.trim()||!Array.isArray(L.items)){ok=false;return}
    var items=[];
    L.items.forEach(function(x){
      if(!x||typeof x.n!=="string"||!x.n.trim()||!Number.isSafeInteger(x.k)||x.k<=0){ok=false;return}
      items.push({n:x.n.trim(),k:x.k});
    });
    lists.push({name:L.name.trim(),items:items});
  });
  if(!ok||!lists.length)return null;
  return {lists:lists,current:(typeof j.current==="string"?j.current:""),savedAt:j.savedAt||""};
}
function applyFullBackup(payload){
  var lists=payload.lists;
  var toplam=lists.reduce(function(a,L){return a+L.items.length},0);
  var ozet=lists.map(function(L){return "• "+L.name+" ("+L.items.length+" kişi)"}).join("\n");
  var msg=toplam+" satır, "+lists.length+" liste bulundu"+(payload.savedAt?("\nYedek tarihi: "+new Date(payload.savedAt).toLocaleString("tr-TR")):"")+":\n"+ozet+"\n\nNasıl geri yüklensin?";
  return openModal({msg:msg,buttons:[
    {label:"Vazgeç",value:null},
    {label:"Yedekle değiştir",value:"replace"},
    {label:"Hepsini birleştir",value:"ok",primary:true}
  ]}).then(function(c){
    if(c===null||c===undefined)return;
    var yeni=0,gunc=0;
    if(c!=="ok"){
      /* Yedekle değiştir: mevcut tüm listeler yedektekiyle birebir değişir */
      data.lists=lists.map(function(L){return {id:uid(),name:L.name,items:L.items.slice()}});
      var hedef=null;
      for(var i=0;i<data.lists.length;i++)if(norm(data.lists[i].name)===norm(payload.current))hedef=data.lists[i];
      data.cur=(hedef||data.lists[0]).id;
      save();$("q").value="";render(false);
      note(lists.length+" liste yedekten geri yüklendi ("+toplam+" satır)");
      return;
    }
    lists.forEach(function(bk){
      var ex=null;for(var i=0;i<data.lists.length;i++)if(norm(data.lists[i].name)===norm(bk.name))ex=data.lists[i];
      if(!ex){ex={id:uid(),name:bk.name,items:[]};data.lists.push(ex);yeni++}
      else gunc++;
      bk.items.forEach(function(p){
        var d=findByName(ex,p.n,null);
        if(d)d.k=p.k;else ex.items.push({n:p.n,k:p.k});
      });
    });
    save();$("q").value="";render(false);
    note(yeni+" liste eklendi, "+gunc+" liste birleştirildi");
  });
}
function parseMultiBackup(text){
  var lines=String(text).split(/\r?\n/),lists=[],curL=null,i,ln;
  for(i=0;i<lines.length;i++){
    ln=lines[i].trim();
    if(!ln)continue;
    if(/^##\s*Liste\s*:/.test(ln)){
      var nm=ln.replace(/^##\s*Liste\s*:/,"").trim();
      curL={name:nm||defName(),items:[]};lists.push(curL);continue;
    }
    if(ln.charAt(0)==="#")continue;
    if(!curL)continue;
    var n="",t="";
    if(ln.indexOf("|")>-1){var p=ln.split("|");t=p.pop();n=p.join("|")}
    else{var m=ln.match(/^(.*?)[\s:;]+([\d.,\s]+?)\s*(?:\u20ba|TL|tl)?$/);if(!m)continue;n=m[1];t=m[2]}
    n=n.trim().replace(/^["']|["']$/g,"");
    var k=parse(t);
    if(n&&k!==null)curL.items.push({n:n,k:k});
  }
  return lists.filter(function(x){return x.items.length>0});
}
function parseBackup(text){
  var out=[],lines=String(text).split(/\r?\n/);
  /* eski sürümün JSON yedeği de okunabilsin */
  try{
    var j=JSON.parse(text);
    if(j&&j.format==="bagis-listesi-backup-v1"&&j.list&&j.list.items){
      j.list.items.forEach(function(x){
        if(x&&typeof x.name==="string"&&Number.isSafeInteger(x.amountKurus)&&x.amountKurus>0)
          out.push({n:String(x.name).trim(),k:x.amountKurus});
      });
      if(out.length)return out;
    }
    if(j&&Array.isArray(j.lists)){ /* tam veri yedeği */
      var L0=null;for(var q=0;q<j.lists.length;q++)if(j.lists[q].id===j.cur)L0=j.lists[q];
      L0=L0||j.lists[0];
      (L0.items||[]).forEach(function(x){if(x&&x.n&&x.k>0)out.push({n:x.n,k:x.k})});
      if(out.length)return out;
    }
  }catch(e){}
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln||ln.charAt(0)==="#")continue;
    var n="",t="";
    if(ln.indexOf("|")>-1){var p=ln.split("|");t=p.pop();n=p.join("|")}
    else{var m=ln.match(/^(.*?)[\s:;]+([\d.,\s]+?)\s*(?:₺|TL|tl)?$/);if(!m)continue;n=m[1];t=m[2]}
    n=n.trim().replace(/^["']|["']$/g,"");
    var k=parse(t);
    if(!n||k===null)continue;
    out.push({n:n,k:k});
  }
  return out;
}
/* --- genel toplam listesi: aynı isimli kişiler tüm listelerde toplanır --- */
/* Türkçe isim karşılaştırması: büyük/küçük harf ve fazla boşluk farkı yok sayılır. */
function personKey(n){return norm(n).replace(/\s+/g," ")}
function collectPeople(){
  var map={},sira=[];
  data.lists.forEach(function(L){
    L.items.forEach(function(it){
      var key=personKey(it.n);
      if(!key)return;
      var p=map[key];
      if(!p){
        p={key:key,name:String(it.n).trim(),total:0,count:0,lists:[]};
        map[key]=p;sira.push(key);
      }
      p.total+=it.k;p.count++;
      var ex=null;
      for(var i=0;i<p.lists.length;i++)if(p.lists[i].name===L.name)ex=p.lists[i];
      if(ex)ex.k+=it.k;
      else p.lists.push({name:L.name,k:it.k});
    });
  });
  return sira.map(function(k){return map[k]});
}
function peopleTotal(people){
  var t=0;people.forEach(function(p){t+=p.total});return t;
}
function openGeneralTotal(){
  var people=collectPeople();
  if(!people.length){note("Henüz hiç kayıt yok.",1);return}
  people.sort(function(a,b){return b.total-a.total||a.name.localeCompare(b.name,"tr")});
  var toplam=peopleTotal(people);
  var kisi=0;data.lists.forEach(function(L){kisi+=L.items.length});
  var tekrar=0;people.forEach(function(p){if(p.lists.length>1)tekrar++});

  var box=document.createElement("div");
  box.className="box";

  var h=document.createElement("p");
  h.innerHTML="";
  h.appendChild(document.createTextNode("Genel toplam — "));
  var b=document.createElement("b");b.textContent=money(toplam);h.appendChild(b);
  box.appendChild(h);

  var sub=document.createElement("p");
  sub.style.cssText="color:var(--muted);font-size:13px;margin:0";
  sub.textContent=data.lists.length+" liste, "+kisi+" kayıt, "+people.length+" kişi"
    +(tekrar?" — "+tekrar+" kişi birden fazla listede toplandı":"");
  box.appendChild(sub);

  var search=document.createElement("input");
  search.type="search";search.placeholder="Kişide ara…";search.setAttribute("autocomplete","off");
  box.appendChild(search);

  var list=document.createElement("div");
  list.className="plist";
  box.appendChild(list);

  function draw(filter){
    var f=filter?norm(filter):"";
    list.innerHTML="";
    var shown=0;
    people.forEach(function(p){
      if(f&&norm(p.name).indexOf(f)<0)return;
      shown++;
      var row=document.createElement("div");row.className="prow";
      var nm=document.createElement("div");nm.className="pn";nm.textContent=p.name;
      var pk=document.createElement("div");pk.className="pk";pk.textContent=money(p.total);
      var pd=document.createElement("div");pd.className="pd";
      pd.textContent=p.lists.map(function(x){return x.name+": "+money(x.k)}).join("  •  ");
      row.appendChild(nm);row.appendChild(pk);row.appendChild(pd);
      list.appendChild(row);
    });
    if(!shown){var e=document.createElement("div");e.className="empty2";e.textContent="Eşleşen kişi yok.";list.appendChild(e)}
  }
  search.oninput=function(){draw(this.value)};
  draw("");

  var btns=document.createElement("div");btns.className="btns";
  var copyBtn=document.createElement("button");copyBtn.type="button";copyBtn.textContent="Listeyi kopyala";
  copyBtn.onclick=function(){
    var f=norm(search.value||"");
    var tx=["Genel toplam: "+money(toplam)];
    people.forEach(function(p){
      if(f&&norm(p.name).indexOf(f)<0)return;
      tx.push(p.name+": "+money(p.total)+"  ("+p.lists.map(function(x){return x.name+": "+money(x.k)}).join(", ")+")");
    });
    copyText(tx.join("\n"),"Genel toplam listesi kopyalandı");
  };
  var closeBtn=document.createElement("button");closeBtn.type="button";closeBtn.className="primary";closeBtn.textContent="Kapat";
  closeBtn.onclick=function(){m.hidden=true};
  btns.appendChild(copyBtn);btns.appendChild(closeBtn);
  box.appendChild(btns);

  var m=$("modal");
  var oldBox=m.querySelector(".box");
  if(oldBox)m.removeChild(oldBox);
  m.appendChild(box);
  m.hidden=false;
  try{search.focus()}catch(e){}
}
/* Panoya kopyalama: eski ve yeni yöntem birlikte denenir */
function copyText(text,okMsg){
  okMsg=okMsg||"Kopyalandı";
  /* 1) modern pano API'si */
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){note(okMsg)},function(){legacyCopy(text,okMsg)});
      return;
    }
  }catch(e){}
  legacyCopy(text,okMsg);
}
/* 2) eski yöntem: gizli alan + execCommand("copy") — WebView'da daha güvenilir */
function legacyCopy(text,okMsg){
  try{
    var ta=document.createElement("textarea");
    ta.value=text;
    ta.setAttribute("readonly","");
    ta.style.position="fixed";ta.style.top="-1000px";ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0,text.length);
    var ok=document.execCommand("copy");
    document.body.removeChild(ta);
    if(ok){note(okMsg);return}
  }catch(e){}
  note("Kopyalanamadı — metni elle seçebilirsiniz.",1);
}
function setupGeneralTotal(){
  var box=$("allbox");
  if(!box)return;
  box.onclick=openGeneralTotal;
  box.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openGeneralTotal()}};
}
/* Yedek menüsü: Kopyala | Dosyaya kaydet | Dosyadan geri yükle */
function backupMenu(){
  return openModal({
    msg:"Yedekleme",
    buttons:[
      {label:"Kapat",value:null},
      {label:"Dosyadan geri yükle",value:"restore"},
      {label:"Dosyaya kaydet (.json)",value:"save"},
      {label:"Metin olarak kopyala",value:"copy",primary:true}
    ]
  }).then(function(c){
    if(c==="restore")doRestore();
    else if(c==="save")doBackup();
    else if(c==="copy")copyBackup();
  });
}
function copyBackup(){
  var L=cur();
  var tx=L.items.map(function(x){return x.n+" | "+fmt.format(x.k/100)}).join("\n");
  try{navigator.clipboard.writeText(tx).then(function(){note("Yedek kopyalandı")},function(){note("Kopyalanamadı",1)})}catch(e){note("Kopyalanamadı",1)}
}
$("bak").onclick=backupMenu;
setupGeneralTotal();
save();render(false);
</script>
